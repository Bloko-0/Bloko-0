    </header>

  <script>
/* Solitaire Studio – dependency-free Klondike engine. Works in browsers and Node tests. */
(function (root, factory) {
  const engine = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = engine;
  root.SolitaireEngine = engine;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const SUITS = ['S', 'H', 'C', 'D'];
  const SYMBOLS = { S: '♠', H: '♥', C: '♣', D: '♦' };
  const RED = new Set(['H', 'D']);
  const clone = x => JSON.parse(JSON.stringify(x));
  const rand = () => Math.random();
  function create(mode = 'easy', random = rand) {
    if (!['easy', 'hard'].includes(mode)) throw new Error('Unknown difficulty');
    const deck = [];
    for (const suit of SUITS) for (let rank = 1; rank <= 13; rank++) deck.push({ id: `${suit}${rank}`, suit, rank, up: false });
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    const game = { mode, stock: deck, waste: [], foundations: SUITS.map(() => []), tableau: SUITS.concat(['A','B','C']).map(() => []), score: 0, moves: 0, seconds: 0, won: false };
    for (let col = 0; col < 7; col++) {
      for (let row = 0; row <= col; row++) {
        const card = game.stock.pop();
        card.up = row === col;
        game.tableau[col].push(card);
      }
    }
    return game;
  }
  function source(g, key) {
    if (key === 'waste') return g.waste;
    if (key === 'stock') return g.stock;
    if (/^t[0-6]$/.test(key)) return g.tableau[Number(key[1])];
    if (/^f[0-3]$/.test(key)) return g.foundations[Number(key[1])];
    return null;
  }
  function valid(g, from, index, to) {
    if (!g || g.won || !from || !to || from === to || to === 'stock' || to === 'waste') return false;
    const a = source(g, from), b = source(g, to);
    if (!a || !b || !Number.isInteger(index) || index < 0 || index >= a.length || from === 'stock') return false;
    const first = a[index];
    if (!first.up) return false;
    if ((from === 'waste' || from.startsWith('f')) && index !== a.length - 1) return false;
    if (from.startsWith('t')) for (let i = index; i < a.length - 1; i++) {
      if (!a[i].up || !a[i + 1].up || a[i].rank !== a[i + 1].rank + 1 || RED.has(a[i].suit) === RED.has(a[i+1].suit)) return false;
    }
    if (to.startsWith('f')) {
      if (index !== a.length - 1 || first.suit !== SUITS[Number(to[1])]) return false;
      return b.length ? b[b.length - 1].rank + 1 === first.rank : first.rank === 1;
    }
    if (to.startsWith('t')) {
      if (!b.length) return first.rank === 13;
      const last = b[b.length - 1];
      return last.up && last.rank === first.rank + 1 && RED.has(last.suit) !== RED.has(first.suit);
    }
    return false;
  }
  function move(g, from, index, to) {
    if (!valid(g, from, index, to)) return false;
    const a = source(g, from), b = source(g, to);
    b.push(...a.splice(index));
    g.moves++;
    if (to.startsWith('f')) g.score += 10;
    else if (from.startsWith('f')) g.score = Math.max(0, g.score - 10);
    else if (from === 'waste') g.score += 5;
    else g.score += 5;
    if (from.startsWith('t') && a.length && !a[a.length - 1].up) {
      a[a.length - 1].up = true;
      g.score += 5;
    }
    g.won = g.foundations.every(p => p.length === 13);
    return true;
  }
  function draw(g) {
    if (!g || g.won || (!g.stock.length && !g.waste.length)) return false;
    if (g.stock.length) {
      const n = Math.min(g.mode === 'easy' ? 1 : 3, g.stock.length);
      for (let i = 0; i < n; i++) { const c = g.stock.pop(); c.up = true; g.waste.push(c); }
    } else {
      g.stock = g.waste.reverse();
      g.stock.forEach(c => { c.up = false; });
      g.waste = [];
    }
    g.moves++;
    return true;
  }
  function hint(g) {
    if (!g || g.won) return null;
    for (let i = 0; i < 7; i++) {
      const a = g.tableau[i];
      for (let j = a.findIndex(c => c.up); j >= 0 && j < a.length; j++) {
        if (j === a.length - 1) for (let f = 0; f < 4; f++) if (valid(g, `t${i}`, j, `f${f}`)) return { from:`t${i}`, index:j, to:`f${f}`, message:'Move this card to the foundation' };
        if (!a.slice(0, j).some(c => !c.up) && a[j].rank === 13) continue;
        for (let t = 0; t < 7; t++) if (valid(g, `t${i}`, j, `t${t}`)) return {from:`t${i}`, index:j, to:`t${t}`, message:'Move this stack to uncover cards'};
      }
    }
    const w = g.waste.length - 1;
    if (w >= 0) {
      for (let f = 0; f < 4; f++) if (valid(g,'waste',w,`f${f}`)) return {from:'waste',index:w,to:`f${f}`,message:'Move this card to the foundation'};
      for (let t = 0; t < 7; t++) if (valid(g,'waste',w,`t${t}`)) return {from:'waste',index:w,to:`t${t}`,message:'Place this card on the board'};
    }
    if (g.stock.length || g.waste.length) return {draw:true, message:g.stock.length?'Try drawing another card':'Recycle the deck to look again'};
    return null;
  }
  function autoSteps(g) {
    if (g.stock.length || g.waste.length || g.tableau.some(p => p.some(c => !c.up))) return null;
    const test = clone(g), steps = [];
    let changed = true;
    while (changed) {

  function showWin(){show(`<p class="eyebrow">DEAL COMPLETE</p><h2 id="modalTitle">You won! ✦</h2><p class="center">All four foundations are complete. Great game!</p><div class="stat-grid"><div class="stat-tile"><strong>${fmtTime(game.seconds)}</strong><span>TIME</span></div><div class="stat-tile"><strong>${number(game.score)}</strong><span>SCORE</span></div><div class="stat-tile"><strong>${number(game.moves)}</strong><span>MOVES</span></div></div><div class="modal-actions"><button class="btn btn-soft" data-action="close">View table</button><button class="btn btn-primary" data-action="new">Play again</button></div>`,'win');}
  function showStats(){const s=stats;show(`<p class="eyebrow">PLAYER DASHBOARD</p><h2 id="modalTitle">Your statistics</h2><p class="center">${escape(session==='cloud'?cloudName:db.activeGuest)} · ${session==='cloud'?'Google account':'Local profile'}</p><div class="stat-grid"><div class="stat-tile"><strong>${number(s.played)}</strong><span>GAMES PLAYED</span></div><div class="stat-tile"><strong>${number(s.wins)}</strong><span>GAMES WON</span></div><div class="stat-tile"><strong>${s.played?Math.round(100*s.wins/s.played):0}%</strong><span>WIN RATE</span></div><div class="stat-tile"><strong>${number(s.bestScore)}</strong><span>BEST SCORE</span></div><div class="stat-tile"><strong>${s.bestTime==null?'–':fmtTime(s.bestTime)}</strong><span>FASTEST WIN</span></div><div class="stat-tile"><strong>${number(s.totalMoves)}</strong><span>MOVES IN WINS</span></div></div><p class="note">${session==='cloud'?'Scores synchronize to your account. Friends see only your chosen display name and game stats.':'Stats and your current game save in this browser. Export a backup if you want to keep them.'}</p><div class="modal-actions"><button class="btn btn-soft" data-action="close">Close</button><button class="btn btn-primary" data-action="export">Export backup</button></div>`,'stats');}
  function showHelp(){show(`<p class="eyebrow">THE RULES</p><h2 id="modalTitle">How to play</h2><p>Move all 52 cards into the four upper-right foundations, from Ace to King, matching suits.</p><ol class="help-steps"><li>Build descending stacks of alternating red and black cards.</li><li>Only Kings can move into empty columns.</li><li>Click the deck to draw. Easy draws one; Hard draws three.</li><li>Tap a face-up card to move it automatically if there is a clear destination. If there are multiple destinations, tap the card and then a destination, or drag.</li><li>Double-click a single card to move it automatically.</li><li>Undo moves, ask for hints, and use Finish when a deal is ready.</li></ol><p class="note"><strong>Shortcuts:</strong> Z undo · H hint · Space draw · N new game · Esc close</p><div class="modal-actions"><button class="btn btn-primary" data-action="close">Got it</button></div>`,'help');}
  function showProfile(){
    if(session==='cloud'){
      show(`<p class="eyebrow">CONNECTED PROFILE</p><h2 id="modalTitle">Your account</h2><div class="account-overview"><span class="avatar-large">${escape(cloudName[0]?.toUpperCase()||'P')}</span><span><strong>${escape(cloudName)}</strong><small>Signed in with Google · Cloud save enabled</small></span></div><div class="subtle-title">Display name visible to friends</div><form id="renameForm" class="field-row"><input type="text" id="renameInput" maxlength="28" aria-label="Display name" required value="${escape(cloudName)}"><button class="btn btn-primary" type="submit">Update</button></form><div class="subtle-title">Your friend code</div><div class="code-bubble">${escape(cloudCode||'Loading…')}</div><div class="modal-actions"><button class="btn btn-soft" data-action="friends">Friends</button><button class="btn btn-soft" data-action="signout">Sign out</button><button class="btn btn-primary" data-action="close">Done</button></div>`,'account');return;
    }
    const list=Object.keys(db.guests).map(name=>`<button class="profile-option ${name===db.activeGuest?'active':''}" data-profile="${escape(name)}"><span>♛ &nbsp;${escape(name)}</span><span>${name===db.activeGuest?'✓ Active':'Switch →'}</span></button>`).join('');
    show(`<p class="eyebrow">OFFLINE PLAYER</p><h2 id="modalTitle">Your profiles</h2><p class="center">Create a local profile or connect Google to save across devices.</p><button class="google-btn" data-action="signin"><span class="google-logo">G</span> Continue with Google</button>${Cloud.configured()?'':'<p class="note">Google sign-in requires the Firebase setup included in the project. Local play is ready now.</p>'}<div class="subtle-title">LOCAL PROFILES</div><div class="profile-list">${list}</div><form id="addGuestForm" class="field-row"><input type="text" id="guestInput" maxlength="22" required placeholder="New profile name" aria-label="New profile name"><button class="btn btn-primary" type="submit">Create</button></form><div class="modal-actions"><button class="btn btn-soft" data-action="import">Import backup</button><button class="btn btn-soft" data-action="export">Export backup</button><button class="btn btn-primary" data-action="close">Close</button></div>`,'account');
  }
  async function showFriends(){if(session!=='cloud'){
      show(`<p class="eyebrow">PLAY WITH FRIENDS</p><h2 id="modalTitle">Your friends</h2><p class="center">Sign in with Google to add friends using private codes, see their best scores, and compare progress.</p><button class="google-btn" data-action="signin"><span class="google-logo">G</span> Continue with Google</button><p class="note">No public player search or chat. Only people you choose to add can become friends.</p><div class="modal-actions"><button class="btn btn-soft" data-action="close">Close</button></div>`,'friends');return;}
    show(`<p class="eyebrow">YOUR CIRCLE</p><h2 id="modalTitle">Friends & leaderboard</h2><p class="center">Only your chosen display name and high scores are shared.</p><div class="subtle-title">YOUR FRIEND CODE</div><div class="code-bubble">${escape(cloudCode)}</div><div class="modal-actions"><button class="btn btn-soft" data-action="copycode">Copy code</button></div><form id="friendForm" class="field-row"><input id="friendCodeInput" maxlength="11" placeholder="Enter a friend code" aria-label="Friend code" required autocomplete="off"><button class="btn btn-primary" type="submit">Add friend</button></form><hr class="divider"><div class="subtle-title">FRIEND REQUESTS</div><div id="requestList" class="friends-list"><p class="loader">Loading requests…</p></div><div class="subtle-title">FRIENDS BY BEST SCORE</div><div id="friendList" class="friends-list"><p class="loader">Loading friends…</p></div><div class="modal-actions"><button class="btn btn-soft" data-action="refreshfriends">Refresh</button><button class="btn btn-primary" data-action="close">Done</button></div>`,'friends',true);
    await refreshFriends();
  }
  async function refreshFriends(){if(session!=='cloud')return;
    try{const result=await Cloud.listFriends();if($('modal').dataset.view!=='friends'||!$('friendList'))return;
      $('requestList').innerHTML=result.incoming.length?result.incoming.map(p=>`<div class="friend-row"><div class="row-main"><span>♛</span><div>${escape(p.name||'Solitaire Player')}<div class="muted">Sent a friend request</div></div></div><div class="row-actions"><button class="mini-btn" data-accept="${escape(p.id)}">Accept</button><button class="mini-btn red" data-decline="${escape(p.id)}">Decline</button></div></div>`).join(''):'<p>No pending requests.</p>';
      const ordered=result.friends.sort((a,b)=>(b.bestScore||0)-(a.bestScore||0));
      $('friendList').innerHTML=ordered.length?ordered.map((p,i)=>`<div class="friend-row"><div class="row-main"><strong>${i+1}.</strong><div><strong>${escape(p.name||'Solitaire Player')}</strong><div class="muted">${number(p.wins)} wins · Best score ${number(p.bestScore)}</div></div></div><button class="mini-btn red" data-unfriend="${escape(p.id)}">Remove</button></div>`).join(''):'<p>No friends yet. Share your code to get started.</p>';
    }catch(e){if($('modal').dataset.view==='friends'){$('friendList').innerHTML='<p>Could not load friends. Check your connection and Firebase rules.</p>';toast(Cloud.strError(e));}}
  }
  function switchGuest(name){if(!db.guests[name]||session!=='guest')return;saveGuest();db.activeGuest=name;loadState(db.guests[name]);save();showProfile();if(!game)showStart();}
  function downloadJSON(){const data={format:'solitaire-studio-v2',savedAt:new Date().toISOString(),profile:session==='guest'?db.activeGuest:cloudName,...currentState()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='solitaire-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);}
  function fromOldBackup(raw){if(raw?.format==='solitaire-studio-v2'||raw?.game?.tableau?.[0]?.[0]?.suit)return raw;
    if(raw?.profiles){const p=raw.profiles[raw.active]||Object.values(raw.profiles)[0];if(p)return convertOld(p);}
    if(raw?.game?.tableau)return convertOld(raw);
    throw Error('Unsupported save file.');
  }
  function convertOld(p){let g=p.game?clone(p.game):null;if(g){const turn=c=>({id:`${E.SUITS[c.s]}${c.r}`,suit:E.SUITS[c.s],rank:c.r,up:!!c.up});for(const a of [g.stock,g.waste,...g.foundations,...g.tableau])for(let i=0;i<a.length;i++)a[i]=turn(a[i]);g.mode=g.mode==='hard'?'hard':'easy';delete g.savedAt;delete g.startedAt;}return {game:g,history:[],stats:p.stats};}
  async function importBackup(file){if(!file||file.size>800000){toast('Invalid or oversized backup.');return;}
    try{const raw=JSON.parse(await file.text()),d=fromOldBackup(raw);if(d.game&&!E.validate(d.game))throw Error('Saved game is invalid.');
      if(game&& !window.confirm('Replace this profile’s current game and stats with the imported backup?'))return;
      loadState(d);save();closeModal();toast('Backup imported successfully.');
    }catch(e){toast(`Could not import: ${e.message}`);}
  }
  async function onAuth(user){clearTimeout(cloudTimer);if(!user){if(session==='cloud'){session='guest';uid=null;cloudName='';cloudCode='';loadState(db.guests[db.activeGuest]||freshProfile());$('saveTag').textContent='● Saved locally';if(!game)showStart();else closeModal();}render();return;}
    if(session==='guest')saveGuest();
    const nextUid=user.uid;
    $('saveTag').textContent='● Loading cloud save…';
    let data=null,cache=null;
    try{data=await Cloud.readPrivate(nextUid);}catch(e){console.warn('Cloud read failed, checking local cache',e);}
    try{cache=JSON.parse(localStorage.getItem(`solitaire-cloud-cache-${nextUid}`));}catch(e){}
    if(cache && (!data || (cache.editedAt||0) > (data.editedAt||0))) data=cache;
    if(!data){data=currentState();} // First login: migrate the active local game.
    session='cloud';uid=nextUid;
    loadState(data);
    try{const pub=await Cloud.ensurePublic(uid,stats);cloudName=pub.name;cloudCode=pub.code;}
    catch(e){cloudName=`Player ${uid.slice(0,4).toUpperCase()}`;cloudCode='';toast('Cloud profile setup failed: check Firestore rules.');}
    render();save();if(!game)showStart();else{closeModal();toast('Signed in. Your game is ready.');}
  }
  // Pointer movement starts drag; a normal click/tap first tries automatic placement.
  document.addEventListener('pointerdown',e=>{if(!$('overlay').classList.contains('hidden')||autoRunning)return;const el=e.target.closest('.card');if(!el||el.dataset.source==='stock')return;
    const from=el.dataset.source,index=Number(el.dataset.index),a=game&&E.source(game,from);
    if(!a?.[index]?.up || (from==='waste'&&index!==a.length-1))return;
    drag={from,index, x:e.clientX,y:e.clientY,pid:e.pointerId,pointerType:e.pointerType,started:false,ghosts:[]};
  },true);
  document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const d=drag;if(!d.started&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<(d.pointerType==='touch'?17:8))return;
    if(!d.started){d.started=true;const items=[...document.querySelectorAll(`.card[data-source="${d.from}"]`)].filter(el=>Number(el.dataset.index)>=d.index);
      d.ghosts=items.map(el=>{const r=el.getBoundingClientRect(),copy=el.cloneNode(true);copy.classList.add('drag-ghost');copy.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;z-index:9999;`;document.body.append(copy);return {node:copy,left:r.left,top:r.top};});
    }
    e.preventDefault();d.ghosts.forEach(g=>{g.node.style.left=(g.left+e.clientX-d.x)+'px';g.node.style.top=(g.top+e.clientY-d.y)+'px';});
  },{capture:true,passive:false});
  document.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;if(!d.started)return;
    d.ghosts.forEach(g=>g.node.remove());suppressClicksUntil=Date.now()+250;
    const el=document.elementFromPoint(e.clientX,e.clientY);const target=el?.closest('.card')?.dataset.source||el?.closest('[data-target]')?.dataset.target;
    if(!target||!doMove(d.from,d.index,target))toast('That move is not allowed.');
  },true);
  document.addEventListener('pointercancel',()=>{if(drag){drag.ghosts.forEach(g=>g.node.remove());drag=null;}});
  // Google-style one-tap moves: prefer an available foundation, then a unique tableau
  // placement. If two tableau destinations are possible, keep the card selected so the
  // player chooses the intended column with a second tap; dragging always remains available.
  function autoDestination(from,index){
    if(!game||game.won||from.startsWith('f'))return null;
    for(let f=0;f<4;f++)if(E.valid(game,from,index,`f${f}`))return `f${f}`;
    const options=[];
    for(let t=0;t<7;t++)if(E.valid(game,from,index,`t${t}`))options.push(`t${t}`);
    return options.length===1?options[0]:null;
  }
  function clickCard(from,index){
    if(from==='stock'){doDraw();return;}
    const arr=game&&E.source(game,from);
    if(!arr?.[index]?.up)return;
    if((from==='waste'||from.startsWith('f'))&&index!==arr.length-1)return;
    // A chosen card followed by a destination card always takes priority.
    if(selected){
      if(selected.from===from&&selected.index===index){selected=null;render();return;}
      if(doMove(selected.from,selected.index,from))return;
    }
    const destination=autoDestination(from,index);
    if(destination&&doMove(from,index,destination))return;
    selected={from,index};hintMark=null;render();
  }
  document.addEventListener('click',async e=>{if(Date.now()<suppressClicksUntil)return;
    if(e.target===$('overlay')){closeModal();return;}
    const modal=e.target.closest('#modal');if(modal){
      const mode=e.target.closest('[data-mode]');if(mode){newGame(mode.dataset.mode);return;}
      const button=e.target.closest('[data-action]');if(button){const action=button.dataset.action;
        if(action==='close')return closeModal();if(action==='backaccount')return showProfile();if(action==='new')return showStart(true);if(action==='export')return downloadJSON();
        if(action==='import'){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>importBackup(input.files[0]);input.click();return;}
        if(action==='signin'){if(!Cloud.configured()){return showSetup();}button.disabled=true;button.textContent='Opening Google sign-in…';try{await Cloud.signIn();}catch(err){toast(Cloud.strError(err));button.disabled=false;button.innerHTML='<span class="google-logo">G</span> Continue with Google';}return;}
        if(action==='signout'){try{await Cloud.signOut();}catch(err){toast(Cloud.strError(err));}return;}
        if(action==='friends')return showFriends();if(action==='refreshfriends')return refreshFriends();if(action==='copycode'){try{await navigator.clipboard.writeText(cloudCode);toast('Friend code copied.');}catch(e){toast(`Your code is ${cloudCode}`);}return;}
      }
      const profile=e.target.closest('[data-profile]');if(profile)return switchGuest(profile.dataset.profile);
      const req=e.target.closest('[data-accept],[data-decline],[data-unfriend]');if(req){const friend=req.dataset.accept||req.dataset.decline||req.dataset.unfriend;
        try{req.disabled=true;if(req.dataset.unfriend){if(!confirm('Remove this friend?')){req.disabled=false;return;}await Cloud.removeFriend(friend);}else await Cloud.respond(friend,Boolean(req.dataset.accept));toast(req.dataset.accept?'Friend added!':req.dataset.decline?'Request declined.':'Friend removed.');await refreshFriends();}catch(err){toast(Cloud.strError(err));req.disabled=false;}return;
      }
      return;
    }
    if(!$('overlay').classList.contains('hidden'))return;
    if(!game||autoRunning)return;
    const card=e.target.closest('.card');if(card)return clickCard(card.dataset.source,Number(card.dataset.index));
    const target=e.target.closest('[data-target]')?.dataset.target;
    if(target==='stock')return doDraw();
    if(selected&&target){if(doMove(selected.from,selected.index,target))return;selected=null;render();}
  });
  document.addEventListener('dblclick',e=>{if(!$('overlay').classList.contains('hidden')||!game||autoRunning)return;const card=e.target.closest('.card');if(!card)return;const from=card.dataset.source,index=Number(card.dataset.index),a=E.source(game,from);
    if(!a?.[index]?.up||index!==a.length-1)return;
    for(let f=0;f<4;f++)if(doMove(from,index,`f${f}`))return;
    for(let t=0;t<7;t++)if(doMove(from,index,`t${t}`))return;
  });
  document.addEventListener('submit',async e=>{e.preventDefault();
    if(e.target.id==='addGuestForm'){const name=$('guestInput').value.trim();if(!name)return;if(db.guests[name])return toast('Profile already exists.');if(Object.keys(db.guests).length>=15)return toast('Maximum 15 local profiles.');db.guests[name]=freshProfile();switchGuest(name);return;}
    if(e.target.id==='renameForm'){const name=$('renameInput').value.trim().slice(0,28);if(!name)return;try{cloudName=await Cloud.rename(name,stats);toast('Display name updated.');render();showProfile();}catch(err){toast(Cloud.strError(err));}return;}
    if(e.target.id==='friendForm'){const code=$('friendCodeInput').value.trim();try{await Cloud.sendRequest(code);$('friendCodeInput').value='';toast('Friend request sent.');}catch(err){toast(Cloud.strError(err));}return;}
  });
  function showSetup(){show(`<p class="eyebrow">ACCOUNT SETUP</p><h2 id="modalTitle">Google sign-in setup</h2><p>This download works offline now. Real Google sign-in and online friends need your own Firebase project and website address.</p><ol class="help-steps"><li>Create a Firebase project and add a web app.</li><li>Enable Google under Authentication → Sign-in method.</li><li>Create a Firestore database and publish the included <code>firestore.rules</code>.</li><li>Paste the Firebase web config into <code>firebase-config.js</code>.</li><li>Host on Firebase Hosting or another HTTPS site and authorize its domain.</li></ol><p class="note">No Google password is stored by this game. Authentication happens through Google's official popup.</p><div class="modal-actions"><button class="btn btn-soft" data-action="backaccount">Back</button><button class="btn btn-primary" data-action="close">Play offline</button></div>`,'setup');}
  $('newBtn').onclick=()=>showStart(true);$('undoBtn').onclick=doUndo;$('hintBtn').onclick=doHint;$('autoBtn').onclick=doAuto;$('statsBtn').onclick=showStats;$('friendsBtn').onclick=showFriends;$('accountBtn').onclick=showProfile;$('menuBtn').onclick=showHelp;
  $('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'♫':'♪̸';$('soundBtn').title=soundOn?'Mute sound':'Turn on sound';beep(620);};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return;}if(e.target.matches('input,textarea')||!$('overlay').classList.contains('hidden'))return;
    if(e.key==='z'||e.key==='Z')doUndo();if(e.key==='h'||e.key==='H')doHint();if(e.key==='n'||e.key==='N')showStart(true);
    if(e.code==='Space'){e.preventDefault();doDraw();}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();clickCard(e.target.dataset.source,Number(e.target.dataset.index));}
  });
  window.addEventListener('resize',()=>{if(game)render();});
  document.addEventListener('visibilitychange',()=>{if(game&&document.hidden)save();});
  window.addEventListener('pagehide',()=>{if(session==='guest')saveGuest();});
  setInterval(()=>{if(game&&!game.won&&!autoRunning&&$('overlay').classList.contains('hidden')&&!document.hidden){game.seconds++;$('time').textContent=fmtTime(game.seconds);if(game.seconds%10===0)save();}},1000);
  loadState(db.guests[db.activeGuest]);if(!game)showStart();
  Cloud.onError=toast;
  if(Cloud.configured()) Cloud.start(onAuth).catch(err=>{$('saveTag').textContent='⚠ Cloud unavailable';console.error(err);toast(Cloud.strError(err));});
  // Minimal testing hook for local automated browser QA. No game secrets or remote actions.
  window.__solitaireTest={getState:()=>currentState(),getSession:()=>session};
})();

</script>
</body>
</html>
